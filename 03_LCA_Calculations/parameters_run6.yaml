# ---------------------------------------------------------------------------
# 7. Social-licence routes for an SMR at Liddell (analyst judgement, 1-3 per criterion; 3 = best).
#    Criteria: legitimacy (chance of durable consent), legal (low litigation risk),
#    speed (time to a siting decision), public_cost (low cost to government), fairness (benefits reach
#    the host and Traditional Owners). Evidence keys support each score; the scores are NOT sourced numbers.
# ---------------------------------------------------------------------------
consent_routes:
  criteria: [legitimacy, legal, speed, public_cost, fairness]
  routes:
    R1_topdown:
      label: "R1 Commonwealth-led siting (2024 Coalition model; acquisition if needed)"
      scores: {legitimacy: 1, legal: 1, speed: 2, public_cost: 2, fairness: 1}
      evidence: [Coalition_Liddell_2024, Barngarla_2023FCA809, Kimba_Ballot_2019, Muckaty_2014]
    R2_volunteer:
      label: "R2 Volunteer host + willingness test incl. Traditional Owners + hosting agreement (NWMO model)"
      scores: {legitimacy: 3, legal: 3, speed: 1, public_cost: 2, fairness: 2}
      evidence: [NWMO_SiteProcess, NWMO_Ignace_2024, Kebaowek_2025FC319]
    R3_equity:
      label: "R3 R2 plus First Nations equity with a government loan guarantee (WTFN/CILGC model)"
      scores: {legitimacy: 3, legal: 3, speed: 1, public_cost: 1, fairness: 3}
      evidence: [WTFN_DNNP_2026, CILGP_2025]
    R4_no_nuclear:
      label: "R4 No SMR: firmed renewables at Liddell (AGL's Hunter Energy Hub)"
      scores: {legitimacy: 3, legal: 3, speed: 3, public_cost: 3, fairness: 2}
      evidence: [AGL_Liddell_NoNuclear, AGL_Liddell_Workforce]
  weight_sets:
    equal: {legitimacy: 1, legal: 1, speed: 1, public_cost: 1, fairness: 1}
    legitimacy_x2: {legitimacy: 2, legal: 1, speed: 1, public_cost: 1, fairness: 1}
    speed_x2: {legitimacy: 1, legal: 1, speed: 2, public_cost: 1, fairness: 1}
    fairness_x2: {legitimacy: 1, legal: 1, speed: 1, public_cost: 1, fairness: 2}
    cost_x2: {legitimacy: 1, legal: 1, speed: 1, public_cost: 2, fairness: 1}
