# Rubric coverage: R3.2, R2.1, R3.8, R3.5, R3.7, R2.7, R1.4, RB.5
#
# Analyst run 3 (20/10/2026): Herfindahl-Hirschman index (HHI) inputs for the BWRX-300 fuel supply chain.
# Read by 03_LCA_Calculations/scripts/hhi.py. To be merged into parameters.yaml by the coordinator.
# Source keys refer to 02_Research/sources_run3.md.
#
# VERIFICATION STATUS (read before using any number):
#   No primary-source host (world-nuclear.org, oecd-nea.org, iaea.org, justice.gov, ftc.gov, govinfo.gov,
#   legislation.gov.au) could be opened from the analyst's session: every fetch failed at the network
#   level. Every value below was taken from search-engine extracts of the named primary page, NOT from
#   the page itself. Each entry therefore carries `verified: false`. Under CLAUDE.md these values are
#   NOT citable until Victor or the fact-checker opens the primary page and sets `verified: true`.
#   Internal consistency checks that passed are noted (e.g. country rows summing exactly to the world total).

meta:
  run: 3
  date: 2026-10-20
  share_unit: percent (HHI = sum of squared percentage shares, range 0 to 10,000)

thresholds:
  doj_ftc_2023_highly_concentrated:
    value: 1800
    rule: "HHI greater than 1,800 = highly concentrated; merger presumption also needs a change in HHI greater than 100"
    source: USDOJ_FTC_2023
    verified: false
  doj_ftc_2010_unconcentrated_below:
    value: 1500
    source: USDOJ_FTC_2010
    verified: false
  doj_ftc_2010_highly_concentrated:
    value: 2500
    rule: "1,500 to 2,500 = moderately concentrated; above 2,500 = highly concentrated (presumption needs a change above 200)"
    source: USDOJ_FTC_2010
    verified: false

