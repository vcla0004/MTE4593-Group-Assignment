# ---------------------------------------------------------------------------
# 2. Conversion capacity by company (tU as UF6 per year), WNA "Conversion and Deconversion" table
#    Check passed: capacities sum to the stated total of 62,000; production sums to 56,259.
# ---------------------------------------------------------------------------
conversion_by_company:
  source: WNA_conversion
  verified: false
  unit: tU/yr
  capacity:
    Cameco: 12500      # Canada, Port Hope (licensed capacity)
    CNNC: 15000        # China, Lanzhou and Hengyang (estimate)
    ConverDyn: 7000    # USA, Metropolis (older licensed value; see alternative below)
    Orano: 15000       # France, Pierrelatte and Malvesi
    Rosatom: 12500     # Russia, Seversk (estimate)
  production:
    Cameco: 11375
    CNNC: 13489
    ConverDyn: 6370
    Orano: 13650
    Rosatom: 11375
  country: {Cameco: Canada, CNNC: China, ConverDyn: USA, Orano: France, Rosatom: Russia}
  converdyn_capacity_alt:
    value: 15000
    source: secondary_converdyn   # Wikipedia / Substack via search; low reliability; sensitivity only
    verified: false

# ---------------------------------------------------------------------------
# 3. Enrichment capacity by company (thousand SWU per year), WNA "Uranium Enrichment" table,
#    which cites the WNA Nuclear Fuel Report 2025. CNNC values are WNA estimates assuming China builds
#    enough capacity for its domestic fleet.
#    Check passed: rows sum to the stated totals (62,641 / 68,076 / 77,784) within 1 kSWU (rounding).
# ---------------------------------------------------------------------------
enrichment_by_company:
  source: WNA_enrichment
  verified: false
  unit: thousand SWU/yr
  2022: {Rosatom: 27100, Urenco: 17300, CNNC: 10613, Orano: 7500, Other_INB_JNFL: 128}
  2025: {Rosatom: 29133, Urenco: 17300, CNNC: 13789, Orano: 7500, Other_INB_JNFL: 355}
  2030: {Rosatom: 29810, Urenco: 18000, CNNC: 18230, Orano: 10000, Other_INB_JNFL: 1744}
  stated_total: {2022: 62641, 2025: 68076, 2030: 77784}
  country: {Rosatom: Russia, Urenco: "UK/Germany/Netherlands (plants in UK, DE, NL, USA)", CNNC: China, Orano: France, Other_INB_JNFL: "Brazil, Japan"}

