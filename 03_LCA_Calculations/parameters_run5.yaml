# Rubric coverage: R3.1, R2.3, R2.7, RB.6, R3.6, R3.7, RB.5
# Analyst run 5 (21/10/2026): economics and finance for section 7 and section 8.2.
# Schema as parameters_run1.yaml: name: {value, low, high, unit, source: <key in 02_Research/sources_run5.md
#   or another sources_*.md>, status, note}.
#   status = "TO VERIFY"   -> seen only in a web-search summary or secondary source. Primary NOT opened:
#                             on 21/10 the proxy refused (403 / DNS fail) csiro.au, sec.gov, canada.ca,
#                             cib-bic.ca, opg.com, lc3.ch, arxiv.org, osti.gov, ncbi.nlm.nih.gov, and
#                             every mirror tried. NOT citable until a person opens the primary.
#   status = "assumption"  -> analyst's stated assumption (placeholder or sensitivity bound only).
#   status = "placeholder" -> stands in for a teammate's number (Sam/lca-analyst, Leroy).
#   status = "from results" -> taken as given from another results file in this repo.
# Read by scripts/lcoe.py and scripts/initiative_cost.py only.

