    value: 0.15
    low: 0.0
    high: 0.25
    unit: fraction of the C$20.9 bn that is interest during construction
    source: assumption
    status: assumption
    note: "No split of interest/escalation/contingency was found (WNN pointer says none was published). GenCost 2025-26 final says its Australian interpretation of Darlington capital was 'revised downwards' to remove IDC (CSIRO news, lead), with no number seen. 0.15 is an analyst assumption; 0 = treat the whole budget as overnight (double-counts IDC, conservative-high)."
  build_years:
    value: 5
    low: 4
    high: 7
    unit: years, uniform spend
    source: assumption
    status: assumption
    note: "Unit 1: construction licence April 2025 (CNSC_2025_LTC) to in-service October 2030 (OEB lead) is about 5.5 years; Units 2-4 overlap. Used only to re-add IDC at each test discount rate."
  capex_low_factor:
    value: 0.85
    unit: multiplier on budget
    source: assumption
    status: assumption
    note: "Downside: learning on Units 2-4 beats the estimate by 15%. Analyst assumption. The OPG/Sollid lead says per-unit overnight cost falls from about EUR 10,700/kW (Unit 1) to EUR 6,900/kW (Unit 4), which is already inside the C$20.9 bn."
