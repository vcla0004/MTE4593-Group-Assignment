    high: 315
    unit: MWe net per unit
    source: OPG_OEB_EB-2025-0297_D2-4-1
    status: placeholder
    note: "300 = deck and parameters_run1.yaml; 315 = OEB exhibit lead (sources.md). Leroy owns."
  capacity_factor:
    value: 0.90
    low: 0.80
    high: 0.95
    unit: fraction
    source: assumption
    status: placeholder
    note: "Same as parameters_run1.yaml. GenCost uses a range from 10% below the 10-year average to the 10-year maximum (GenCost FAQ, lead); range here is a sensitivity bracket."
  econ_life_yr:
    value: 60
    low: 30
    high: 60
    unit: years
    source: assumption
    status: placeholder
    note: "60 = design life placeholder (parameters_run1.yaml). 30 = a financing/regulatory-asset horizon, the GenCost-style shorter economic life case [GenCost's own economic life for nuclear TO VERIFY]."
