    value: 1.75
    unit: multiplier on budget
    source: nuscale_class3_2023
    status: TO VERIFY
    note: "Upside: the NuScale/UAMPS CFPP estimate rose US$5.3 bn -> US$9.24 bn (x1.74) between estimate classes (sources_run4.md NuScale_DCRA_2023). Units 2-4 are still Class 4 estimates (OPG/Sollid lead), so a CFPP-sized overrun is the precedent used, not a forecast."

