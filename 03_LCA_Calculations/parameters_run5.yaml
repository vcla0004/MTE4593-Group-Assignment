    source: OPG_2025_Q1
    status: TO VERIFY
    note: "Same figure as parameters_run1.yaml. OPG Q1 2025 release (sources.md) says it includes interest, escalation and contingency; the Globe and Mail / World Nuclear Report leads describe it as '2024 dollars'. The two descriptions conflict (nominal with escalation vs constant 2024$). lcoe.py treats it as real 2024 C$ and flags the bias (section 4 of lcoe.md)."
