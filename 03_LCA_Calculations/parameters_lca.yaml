    status: TO VERIFY
    note: "EDF (2024) French fleet: operation 9% of 3.7 g/kWh = 0.33 (WNN/Euronuclear report of the study, lead). Range x0.5-x2 (assumption) for transfer to one BWRX-300."
  decom_g_per_kwh:
    value: 0.11
    low: 0.06
    high: 0.33
    dist: tri
    unit: g CO2e per kWh (decommissioning)
    source: edf2024_lca
    status: TO VERIFY
    note: "EDF (2024): decommissioning 3% of 3.7 = 0.11 (lead). High x3 (assumption): an SMR has more structure per MWh than a large PWR."
  backend_g_per_kwh:
    value: 0.56
    low: 0.28
    high: 1.11
    dist: tri
    unit: g CO2e per kWh (spent fuel storage, conditioning, disposal)
    source: edf2024_lca
    status: TO VERIFY
