    status: TO VERIFY
    note: "1/0.8938 (AUD->CAD mid-market 12 May 2025, Wise; 0.882–0.901 through May 2025). Replace with RBA F11 rate for 8 May 2025. Range covers May 2025."
  smr_lcoe_aud:
