    source: csiro2024_gencost2324
    status: TO VERIFY
    note: "Switched 21/10/2026 (pre-Q8) to the context-card default reading: GenCost 2023-24 final 2030 SMR range 230-382, midpoint 306 (NucNet 23 May 2024 lead; same as parameters_run5.yaml gencost2324_smr_2030_aud). The previous value 514 (387-641) is kept as smr_lcoe_2023_alt_aud (the alternative reading: probably the 2023 value). Primary table not opened (csiro.au blocked)."
  smr_lcoe_2023_alt_aud:
    value: 514
    low: 387
    high: 641
