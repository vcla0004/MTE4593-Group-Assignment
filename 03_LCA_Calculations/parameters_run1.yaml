  smr_lcoe_low_alt_aud:
    value: 198
    high: 349
    unit: AUD/MWh
    source: kim_macfarlane2026
    status: TO VERIFY
    note: "AU$198–349/MWh attributed to CSIRO in a 2026 NIRS-hosted paper (edition unknown; possibly a 2050 or earlier-edition value). Low-cost sensitivity only."
  vre_firmed_lcoe_aud:
