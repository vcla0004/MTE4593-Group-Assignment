# Rubric coverage: R2.1, R2.3, R2.7, R3.1, R3.6, R4.3, RB.6
# Analyst run 1 (20/10/2026): displacement, schedule value, same money.
# Q2 re-base (21/10/2026, analyst run 7a): smr_lca_g_per_kwh set to our LCA (4.2, 3.0-5.8); C1 saving and Canadian carbon price added.
# Pre-Q8 (21/10/2026): smr_lcoe_aud and vre_firmed_lcoe_aud switched to GenCost 2023-24's 2030 reading (306, 107); old values kept as *_alt_aud keys.
# Schema as parameters.yaml: name: {value, unit, source: <key in 02_Research/sources_run1.md> | assumption, note}
# Added fields: low/high (sensitivity range), status.
#   status = "TO VERIFY"   -> number seen only in a search summary or secondary source. The primary
#                             could NOT be opened on 20/10 (proxy policy 403 on every primary host:
#                             csiro.au, ontario.ca, opg.com, unece.org, ipcc.ch, nrel.gov, dcceew.gov.au,
#                             aemo.com.au, ieso.ca, cer-rec.gc.ca, rba.gov.au, taf.ca,
#                             cleanenergyregulator.gov.au). NOT citable until a human opens the primary.
#   status = "assumption"  -> analyst's stated assumption, used only as a placeholder or sensitivity bound.
#   status = "placeholder" -> stands in for a teammate's number (Sam or Leroy); swap in when delivered.
# Every script reads only this file. Change a value here, re-run the scripts, and results/ update.

parameters:

  # ---------------- Plant (Leroy / Sam own these; placeholders until delivered) ----------------
  net_mwe:
    value: 300
    low: 290
    high: 300
    unit: MWe (net, per BWRX-300 unit)
    source: assumption
    status: placeholder
    note: "Deck value. Leroy to supply sourced net output (plan §5). Low 290 is a sensitivity bound only, not a sourced figure."
  capacity_factor:
    value: 0.90
    low: 0.80
    high: 0.95
    unit: fraction
    source: assumption
    status: placeholder
    note: "Deck assumption. Sam/Leroy to source (plan §2.5 item 3). Range is a sensitivity bracket."
  design_life_yr:
    value: 60
    low: 40
    high: 80
    unit: years
    source: assumption
    status: placeholder
    note: "Plan §2.3 planning arithmetic uses 60. Leroy to source from GEH/OPG documents."
  units_darlington:
    value: 4
    unit: units
    source: ontario2025_fid
    status: TO VERIFY
    note: "Four BWRX-300 units, about 1,200 MW total (secondary: World Nuclear News, BLG, Globe and Mail)."

  # ---------------- SMR life-cycle intensity (Sam's number replaces the central value) ----------------
  smr_lca_g_per_kwh:
    value: 4.2
    low: 3.0
    high: 5.8
    unit: g CO2e/kWh (life cycle, one BWRX-300 at Darlington, cradle to grave incl. fuel cycle)
    source: lca_results_2110
    status: from results
    note: "Q2 re-base (21/10): our hybrid LCA, results/lca.md section 0 and lca_montecarlo_summary.csv (median 4.178, P5 3.048, P95 5.849; mean 4.28; mode case 2.70). Its inputs are TO VERIFY (lca-analyst). Replaces the UNECE (2021) midpoint placeholder 5.75 (5.1-6.4), kept as smr_lca_unece_g_per_kwh for comparison."
  smr_lca_unece_g_per_kwh:
    value: 5.75
    low: 5.1
    high: 6.4
    unit: g CO2e/kWh (life cycle)
    source: unece2021
    status: TO VERIFY
    note: "Former placeholder (midpoint of UNECE 2021 nuclear range as reported by secondary sources). Benchmark only (RB.6); not used in the central case after 21/10."

  # ---------------- Initiative C1 (lca-analyst results, taken as given) ----------------
  c1_saving_t_per_unit:
    value: 1734
    low: 1387
    high: 2153
    unit: t CO2e saved per unit (S2 LC3 vs S0 GU in the C1 target structures, concrete A1-A3)
    source: lca_results_2110
    status: from results
    note: "results/lca_scenarios.csv S2 central 1,734 (plan Q2 '1.74 kt'); Monte Carlo P5-P95 1,387-2,153 (lca_montecarlo_summary.csv). Inputs TO VERIFY."
  c1_saving_t_units_2_4:
    value: 5201
    low: 4161
    high: 6458
    unit: t CO2e, Units 2-4 (three units)
    source: lca_results_2110
    status: from results
    note: "results/lca_scenarios.csv S2 central 5,201; MC P5-P95 4,161-6,458."

  # ---------------- Carbon price for C1's carbon value (Q2) ----------------
  carbon_price_2026_cad:
    value: 95
    low: 95
    high: 110
    unit: C$/t CO2e, Canadian headline industrial carbon price, 2026
    source: eccc2026_industrial_trajectory
    status: TO VERIFY
    note: "Search summaries (21/10) of the canada.ca 'Industrial carbon pricing in Canada' page and ICAP news 'Canada publishes new carbon price trajectory': new headline trajectory published 19 May 2026, effective 15 May 2026: C$95 in 2026, C$100 in 2027-2029, C$115 in 2030, +C$3/yr to C$130 in 2035, +1.5%/yr to C$140 in 2040; full updated benchmark due later in 2026. canada.ca and icapcarbonaction.com refused by the proxy (403), so NOT confirmed. High 110 = the superseded 2021 benchmark path for 2026 (C$65 in 2023 +15/yr to C$170 in 2030), as used by run 5 (parameters_run5.yaml carbon_prices_cad). CONFLICT with run 5 logged in plan.md Interfaces."
  carbon_price_2030_cad:
    value: 115
    low: 115
    high: 170
    unit: C$/t CO2e, 2030 (Units 2-4 concrete placement period, about 2029-2033)
    source: eccc2026_industrial_trajectory
    status: TO VERIFY
    note: "New trajectory C$115 (lead, as above); high 170 = superseded 2021 path (run 5's 2030 value)."

  smr_lca_stress_g_per_kwh:
    value: 12
    low: 12
    high: 110
    unit: g CO2e/kWh
    source: ipcc2014_annex3
    status: TO VERIFY
    note: "Stress test only. 12 = IPCC AR5 Annex III / NREL harmonised nuclear median, 110 = AR5 max, as commonly quoted; NOT confirmed even in a search result on 20/10. Do not cite until Annex III Table A.III.2 is opened."

  # ---------------- Ontario grid ----------------
  ont_avg_2022_cer:
    value: 35
    unit: g CO2e/kWh generated
    source: cer_ontario_profile
    status: TO VERIFY
    note: "CER Provincial and Territorial Energy Profiles: Ontario (search summary)."
  ont_avg_2023_snapshot:
    value: 53
    unit: g CO2e/kWh
    source: ontario_energy_snapshot
    status: TO VERIFY
    note: "Ontario energy snapshot (ontario.ca); value used in the deck. Basis (generation vs consumption) unknown."
  ont_avg_2024_taf:
    value: 73.8
    low: 73
    high: 73.8
    unit: g CO2e/kWh
    source: taf2025
    status: TO VERIFY
    note: "TAF carbon page gives 73.8 for 2024; TAF 2025 webinar slide gives 73. Central for Ontario average (latest year)."
  ont_marginal_taf:
    value: 343
    low: 343
    high: 472
    unit: g CO2e/kWh
    source: taf2025
    status: TO VERIFY
    note: "343 = a 2024 annual figure on a TAF 2025 webinar slide headed 'Historical Annual MEF' (slide wording ambiguous: may be an average of hourly marginal factors). High 472 = TAF (2021) gas-fired generation factor (gas sets the margin in most Ontario hours). Both TO VERIFY in the TAF PDFs."
  ont_future_2040:
    value: 15
    low: 15
    high: 73.8
    unit: g CO2e/kWh
    source: ieso2024_energy_future
    status: TO VERIFY
    note: "IESO 'Ontario's Energy Future' Spring 2024 reportedly projects about 15 g/kWh by 2040 (search summary). High = 2024 level held flat (no decarbonisation) as a sensitivity."
  ont_marginal_converge_year:
    value: 2050
    low: 2040
    high: 2060
    unit: year
    source: assumption
    status: assumption
    note: "Case ON-marginal-declining: marginal factor falls linearly from ont_marginal_taf (2024) to ont_future_2040 by this year, i.e. gas leaves the margin. Analyst assumption, not an IESO forecast."
  ont_traj_start_year:
    value: 2024
    unit: year
    source: taf2025
    status: TO VERIFY
    note: "Ontario trajectory anchored at the 2024 average, linear to ont_future_2040 in 2040, flat after. Analyst construction, not an IESO series."

  # ---------------- NSW / NEM grid ----------------
  nsw_scope2_2025:
    value: 640
    unit: g CO2e/kWh (NGA Factors 2025, NSW and ACT, scope 2, location-based)
    source: dcceew2025_ngaf
    status: TO VERIFY
    note: "0.64 kg/kWh, seen in an ASIC education module citing NGA Factors 2025; official DCCEEW workbook not opened. Scope 2 = direct combustion emissions per kWh consumed; excludes upstream fuel and T&D losses (scope 3)."
  bayswater_ei:
    value: 990
    unit: g CO2e/kWh sent out (combustion + fugitive)
    source: aemo_cdeii
    status: TO VERIFY
    note: "0.99 t/MWh for Bayswater from AEMO Available Generators File as quoted in an older Synergy submission (derived from 0.0989 t/GJ at 35.9% HHV sent-out efficiency). Liddell closed April 2023, so Bayswater (same Hunter site cluster) is the upper-bound coal unit. Current CDEII file not opened."
  coal_lca_unece:
    value: 1000
    low: 751
    high: 1095
    unit: g CO2e/kWh (life cycle)
    source: unece2021
    status: TO VERIFY
    note: "UNECE coal range 751 (IGCC) or 753 to 1095 reported by secondary sources (they disagree on the low end). Central 1000 is an analyst choice for subcritical black coal; used only for the boundary-consistent (life cycle vs life cycle) upper bound."
  gas_cc_lca_unece:
    value: 458
    low: 403
    high: 513
    unit: g CO2e/kWh (life cycle)
    source: unece2021
    status: TO VERIFY
    note: "UNECE gas combined cycle 403–513 (secondary). Central = midpoint."
  nem_traj_start_year:
    value: 2025
    unit: year
    source: dcceew2025_ngaf
    status: TO VERIFY
    note: "NEM/NSW trajectories start at nsw_scope2_2025 in 2025."
  nem_coal_exit_year_stepchange:
    value: 2038
    unit: year
    source: aemo2024_isp
    status: TO VERIFY
    note: "2024 ISP Step Change reportedly has all NEM coal gone by 2038 (secondary: Ark Energy briefing). Trajectory T1 declines linearly to the floor by this year. Replace T1 with the 2026 ISP (final, June 2026) Step Change emissions / generation series when opened."
  nem_slow_exit_year:
    value: 2050
    unit: year
    source: assumption
    status: assumption
    note: "Trajectory T2 (slow transition): linear decline to floor by 2050. Sensitivity, not an AEMO scenario."
  nem_floor_g_per_kwh:
    value: 30
    low: 0
    high: 80
    unit: g CO2e/kWh
    source: assumption
    status: assumption
    note: "Residual grid intensity after coal exit (gas firming). Placeholder; replace with ISP value. NOT insignificant: under T1 the SMR runs its whole life on this floor, so it dominates the Liddell lifetime result (see displacement.md section 5)."

  # ---------------- Start dates (Leroy owns; placeholders) ----------------
  ont_unit1_start:
    value: 2030
    low: 2030
    high: 2031
    unit: year (first full year of operation)
    source: ontario2025_fid
    status: placeholder
    note: "OPG: grid connection by end 2030 / commercial operation end 2029 (secondary sources disagree). Leroy to confirm."
  ont_units2to4_start:
    value: 2035
    low: 2034
    high: 2036
    unit: year
    source: opg_dnnp
    status: placeholder
    note: "Mid-2030s, 2034–2036 (secondary: Power Engineering). Leroy to confirm."
  aus_start_coalition:
    value: 2035
    unit: year
    source: assumption
    status: placeholder
    note: "Coalition 2024 plan's earliest claim (plan §5: 2035/2037, secondary, TO VERIFY). Leroy owns."
  aus_start_csiro:
    value: 2040
    unit: year
    source: csiro2024_gencost2324
    status: TO VERIFY
    note: "GenCost 2023-24: development time at least 15 years, deployment from 2040 at the earliest (said of large-scale nuclear; whether it applies to SMRs is TO VERIFY). Central Australian start year."
  aus_start_late:
    value: 2045
    unit: year
    source: assumption
    status: assumption
    note: "Late case: five years' slip on the CSIRO earliest date. Sensitivity only."

  # ---------------- Money ----------------
  dnnp_budget_cad:
